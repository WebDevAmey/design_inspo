<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Cassette Deck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Chakra+Petch:wght@400;500;600&display=swap">
<style>
/* The deck from the reference, fixed in place on a white ground, inside a 1340x650 stage.
   Left: full-size cassettes (same size as the one behind the glass). They travel in and out through a slot in the left side.
   Top keys (brown, left): 1 eject, 2 play / pause, 3 stop. Body 720x540 at (560,44). */
:root {
  --ground: #ffffff;
  --rim: #e6ddce;
  --hair: rgba(110, 86, 56, .30);
  --copper: #b98a58;
  --taupe: #645a50;
  --ink: #3d342c;
  --ease-out: cubic-bezier(.23, 1, .32, 1);
  --font: "Chakra Petch", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--ground); color: var(--ink);
  font: 400 14px/1.4 var(--font);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; -webkit-user-select: none; user-select: none; touch-action: manipulation; }
button:focus-visible, [role="slider"]:focus-visible, .tp:focus-visible { outline: 2px solid #e28a2c; outline-offset: 3px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

main { width: 100%; display: flex; justify-content: center; }
#fit { width: 100%; max-width: 1400px; position: relative; }
.stage { position: absolute; left: 0; top: 0; width: 1340px; height: 650px; transform-origin: 0 0; -webkit-user-select: none; user-select: none; }
.floor { position: absolute; left: 544px; top: 556px; width: 740px; height: 84px; pointer-events: none;
  background: radial-gradient(50% 40% at 50% 30%, rgba(60,40,20,.2), rgba(60,40,20,0) 100%); filter: blur(4px); }

/* ---------- Cassettes (beneath the body, so they disappear into the side slot) ---------- */
#rack { position: absolute; inset: 0; z-index: 0; pointer-events: none; }
.tp { position: absolute; left: 0; top: 0; width: 400px; height: 196px; pointer-events: auto; cursor: grab; touch-action: none; transform-origin: 50% 50%; will-change: transform;
  filter: drop-shadow(0 1px 1px rgba(40,25,10,.3)) drop-shadow(0 10px 12px rgba(40,25,10,.22)); }
.tp:active { cursor: grabbing; }
.tp svg { display: block; width: 400px; height: 196px; }
.tp.inside { pointer-events: none; }
/* lifted in the hand: a softer, longer shadow fades in (opacity only) */
.tp::after { content: ""; position: absolute; left: 14px; right: 14px; top: 20px; bottom: 0; z-index: -1; border-radius: 16px; box-shadow: 0 26px 30px -8px rgba(40,25,10,.38); opacity: 0; transition: opacity 240ms var(--ease-out); }
.tp.lift::after { opacity: 1; }

/* ---------- Body: front face plus an extruded shell, so the top and left side read in depth ---------- */
.side { position: absolute; left: 544px; top: 30px; width: 720px; height: 540px; border-radius: 72px; z-index: 1;
  background: linear-gradient(90deg, rgba(80,58,36,.20) 0%, rgba(80,58,36,0) 7%), linear-gradient(180deg, #f3ede3 0%, #e6dccc 5%, #d3c6b2 100%);
  box-shadow: 0 0 0 1px rgba(105,82,54,.32), inset 1px 1.5px 0 rgba(255,255,255,.75),
              0 2px 2px rgba(60,40,20,.10), 0 14px 22px -8px rgba(60,40,20,.22), 0 40px 52px -20px rgba(60,40,20,.30), 0 76px 96px -46px rgba(60,40,20,.34); }
.body { position: absolute; left: 560px; top: 44px; width: 720px; height: 540px; border-radius: 72px; z-index: 1;
  background: linear-gradient(180deg, #f1eadf 0%, #e9e0d2 55%, #dfd4c3 100%);
  box-shadow: 0 0 0 1px rgba(105,82,54,.36), inset 0 1.5px 0 rgba(255,255,255,.9), inset 1.5px 0 0 rgba(255,255,255,.5), inset 0 -2px 0 rgba(120,92,56,.14), inset 0 -16px 26px rgba(120,92,56,.10), -2px -2px 3px rgba(60,40,20,.12); }
.feet i { position: absolute; top: 538px; height: 12px; border-radius: 0 0 8px 8px; background: linear-gradient(#cfc2ad, #b9ab95); box-shadow: 0 0 0 1px rgba(110,86,56,.26); }
.feet i:nth-child(1) { left: 136px; width: 72px; } .feet i:nth-child(2) { left: 520px; width: 96px; }
/* loading slot cut into the left side wall */
.slot { position: absolute; left: 3px; top: 210px; width: 8px; height: 206px; border-radius: 4px; background: linear-gradient(90deg, #1f1813, #3d3129); box-shadow: inset 0 2px 4px rgba(0,0,0,.65), 0 0 0 1px rgba(110,86,56,.28), 1px 0 0 rgba(255,255,255,.4); }

/* Three brown keys standing in the top surface, as in the reference: lighter top face, darker front, clipped where they enter the shell */
.tabwell { position: absolute; left: 0; top: -40px; width: 720px; height: 48px; overflow: hidden; pointer-events: none; }
.tab { position: absolute; top: 12px; width: 84px; height: 40px; border-radius: 6px 6px 2px 2px; pointer-events: auto;
  background: linear-gradient(180deg, #cdc1b0 0, #c2b5a2 7px, #a99a86 8px, #9a8b77 100%);
  box-shadow: inset 0 0 0 1px rgba(78,60,42,.5), inset 0 1px 0 1px rgba(255,246,232,.35), inset 0 -10px 12px -8px rgba(50,35,20,.35), 0 2px 3px rgba(60,40,20,.22);
  transition: transform 80ms var(--ease-out), box-shadow 80ms var(--ease-out); }
#kEject { left: 152px; } #kPlay { left: 248px; } #kStop { left: 344px; }
.tab:active, .tab[aria-pressed="true"] { transform: translateY(6px); box-shadow: inset 0 0 0 1px rgba(78,60,42,.5), inset 0 2px 3px rgba(40,28,16,.35), 0 1px 1px rgba(60,40,20,.2); }

.plate { position: absolute; inset: 16px; border-radius: 58px; background: linear-gradient(180deg, #f2ebe0, #e8dfd0 70%, #e2d8c7);
  box-shadow: 0 0 0 1.5px rgba(185,138,88,.9), 0 1px 0 1.5px rgba(255,255,255,.75), inset 0 1.5px 1px rgba(255,255,255,.8), inset 0 -3px 6px rgba(140,110,70,.12); }
.plate::after { content: ""; position: absolute; inset: 8px; border-radius: 50px; border: 1px solid rgba(185,138,88,.45); pointer-events: none; }

/* ---------- Display ---------- */
.lcd { position: absolute; left: 48px; top: 48px; width: 440px; height: 120px; border-radius: 22px; overflow: hidden; background: #221a15;
  box-shadow: 0 0 0 6px var(--rim), 0 0 0 7px var(--hair), 0 1px 0 7px rgba(255,255,255,.7), inset 0 2px 6px rgba(0,0,0,.8); }
.lcd canvas { position: absolute; left: 0; top: 0; width: 440px; height: 120px; }

/* ---------- Right column ---------- */
.knob-wrap { position: absolute; left: 596px; top: 124px; width: 0; height: 0; }
.bezel { position: absolute; left: -76px; top: -76px; width: 152px; height: 152px; border-radius: 50%;
  background: radial-gradient(circle at 50% 35%, #ddd1bf, #c7b9a3);
  box-shadow: 0 0 0 1px var(--hair), inset 0 4px 9px rgba(80,55,28,.38), inset 0 -2px 3px rgba(255,255,255,.6), 0 1px 0 1px rgba(255,255,255,.75); }
.ring { position: absolute; left: -76px; top: -76px; width: 152px; height: 152px; border-radius: 50%;
  background: conic-gradient(from -135deg, #f3a24a 0deg, #ffb663 calc(var(--v) * 270deg), rgba(90,70,45,.18) calc(var(--v) * 270deg) 270deg, transparent 270deg);
  -webkit-mask: radial-gradient(circle, transparent 66px, #000 67px 70px, transparent 71px); mask: radial-gradient(circle, transparent 66px, #000 67px 70px, transparent 71px);
  filter: drop-shadow(0 0 4px rgba(255,140,40,.75)); }
.knob { position: absolute; left: -62px; top: -62px; width: 124px; height: 124px; border-radius: 50%; cursor: grab; touch-action: none;
  box-shadow: 0 1px 1px rgba(60,40,20,.35), 0 6px 10px -2px rgba(60,40,20,.35), 0 16px 22px -8px rgba(60,40,20,.35); }
.knob:active { cursor: grabbing; }
.knob .face { position: absolute; inset: 0; border-radius: 50%; transform: rotate(calc(var(--v) * 270deg - 135deg));
  background: repeating-radial-gradient(circle at 50% 50%, rgba(0,0,0,.045) 0 1px, transparent 1px 3px),
              conic-gradient(from 30deg, #d0c5b3, #f4eee3, #ada08c, #ebe2d2, #b8ab95, #f2e9da, #d0c5b3);
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.5), inset 0 0 12px rgba(90,70,40,.22); }
.knob .face::before { content: ""; position: absolute; inset: 0; border-radius: 50%; background: repeating-conic-gradient(rgba(60,45,30,.22) 0 1.1deg, rgba(255,255,255,.18) 1.1deg 3deg); -webkit-mask: radial-gradient(circle, transparent 55px, #000 56px); mask: radial-gradient(circle, transparent 55px, #000 56px); }

.sbtn { position: absolute; top: 222px; width: 64px; height: 62px; border-radius: 14px; display: grid; place-items: center; color: #675c52;
  background: linear-gradient(180deg, #f7f2ea, #e9e0d3);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.95), 0 0 0 1px rgba(110,86,56,.28), 0 4px 0 #cbbfac, 0 4px 0 1px rgba(110,86,56,.25), 0 7px 7px -1px rgba(60,40,20,.3);
  transition: transform 70ms var(--ease-out), box-shadow 70ms var(--ease-out), color 160ms; }
.sbtn svg { filter: drop-shadow(0 1px 0 rgba(255,255,255,.75)); }
.sbtn:active, .sbtn[aria-pressed="true"] { transform: translateY(3px); box-shadow: inset 0 1px 3px rgba(90,62,30,.2), 0 0 0 1px rgba(110,86,56,.28), 0 1px 0 #cbbfac, 0 1px 0 1px rgba(110,86,56,.25), 0 2px 2px rgba(60,40,20,.25); }
.sbtn[aria-pressed="true"] { color: #c47a22; }
#loud { left: 520px; } #nr { left: 608px; }
.grille { position: absolute; left: 524px; top: 312px; width: 144px; height: 96px;
  background: radial-gradient(circle, #4f453c 0 2.3px, rgba(79,69,60,.3) 2.6px, transparent 3px) 0 0 / 12px 12px; }
.led { position: absolute; left: 520px; top: 456px; width: 12px; height: 12px; border-radius: 50%; background: #bfae95; box-shadow: inset 0 1px 1px rgba(0,0,0,.25), 0 0 0 1px var(--hair); transition: background 240ms, box-shadow 240ms; }
.led.on { background: #ffb256; box-shadow: 0 0 0 1px rgba(255,150,50,.5), 0 0 9px 2px rgba(255,150,50,.65); }
.port { position: absolute; left: 616px; top: 448px; width: 56px; height: 28px; border-radius: 14px; background: #3a312a; box-shadow: 0 0 0 3px #d6cab7, 0 0 0 4px var(--hair), inset 0 2px 4px rgba(0,0,0,.6); }
.port::after { content: ""; position: absolute; left: 10px; right: 10px; top: 10px; height: 8px; border-radius: 4px; background: #cdc0ab; }

/* ---------- Cassette window behind smoked glass ---------- */
.win { position: absolute; left: 58px; top: 192px; width: 420px; height: 216px; border-radius: 22px; overflow: hidden;
  background: linear-gradient(180deg, #2c231d, #1d1713);
  box-shadow: 0 0 0 2px var(--copper), 0 0 0 7px var(--rim), 0 0 0 8px var(--hair), 0 1px 0 8px rgba(255,255,255,.7), inset 0 4px 12px rgba(0,0,0,.7); }
.mech { position: absolute; inset: 0; }
.cas { position: absolute; left: 10px; top: 10px; width: 400px; height: 196px; transform: translateX(-480px); filter: drop-shadow(0 3px 4px rgba(0,0,0,.5)); }
.cas canvas, .cas svg { position: absolute; left: 0; top: 0; width: 400px; height: 196px; display: block; }
.smoke { position: absolute; inset: 0; pointer-events: none; background: linear-gradient(180deg, rgba(120,78,38,.34), rgba(90,56,26,.42)); mix-blend-mode: multiply; }
.doorglass { position: absolute; inset: 0; border-radius: 22px; pointer-events: none; box-shadow: inset 0 0 0 1px rgba(255,220,180,.12), inset 0 0 0 3px rgba(0,0,0,.25), inset 0 16px 24px -12px rgba(0,0,0,.5); }
.wscrew { position: absolute; width: 12px; height: 12px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #8a7a68, #3e3229); box-shadow: inset 0 0 0 1px rgba(0,0,0,.4), 0 1px 0 rgba(255,255,255,.12); }
.wscrew::after { content: ""; position: absolute; left: 2px; right: 2px; top: 5px; height: 1.6px; background: rgba(0,0,0,.6); transform: rotate(45deg); }

/* ---------- Transport: five raised keys in a recessed tray, each with a visible lip that collapses when pressed ---------- */
.transport { position: absolute; left: 48px; top: 428px; width: 440px; height: 68px; display: flex; gap: 4px; padding: 5px 6px 9px; border-radius: 34px;
  background: linear-gradient(180deg, #d5c9b6, #e0d5c4); box-shadow: inset 0 2px 5px rgba(70,50,30,.3), inset 0 -1px 0 rgba(255,255,255,.55), 0 1px 0 rgba(255,255,255,.85); }
.tbtn { flex: 1 1 0; display: grid; place-items: center; color: #675c52; border-radius: 7px;
  background: linear-gradient(180deg, #f8f3eb, #e9e0d3);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.95), 0 0 0 1px rgba(110,86,56,.26), 0 4px 0 #cbbfac, 0 4px 0 1px rgba(110,86,56,.24), 0 6px 6px -1px rgba(60,40,20,.3);
  transition: transform 70ms var(--ease-out), box-shadow 70ms var(--ease-out); }
.tbtn:first-child { border-radius: 26px 7px 7px 26px; } .tbtn:last-child { border-radius: 7px 26px 26px 7px; }
.tbtn svg { display: block; width: 18px; height: auto; filter: drop-shadow(0 1px 0 rgba(255,255,255,.75)); }
.tbtn:active, .tbtn[aria-pressed="true"] { transform: translateY(3px); color: #51473e;
  box-shadow: inset 0 1px 3px rgba(90,62,30,.2), 0 0 0 1px rgba(110,86,56,.26), 0 1px 0 #cbbfac, 0 1px 0 1px rgba(110,86,56,.24), 0 2px 2px rgba(60,40,20,.25); }

.strap { position: absolute; left: 700px; top: 112px; pointer-events: none; filter: drop-shadow(3px 8px 5px rgba(60,35,15,.25)); }

.hint { margin: 0; color: #7b8491; font-size: 13px; letter-spacing: .02em; text-align: center; max-width: 640px; text-wrap: balance; }
.hint kbd { font: 500 11px/1 var(--font); border: 1px solid #d5d9df; border-radius: 5px; padding: 2px 5px; background: #f6f7f9; color: #5b6471; }

@media (prefers-reduced-motion: reduce) { * { transition-duration: .01ms !important; } }
</style>

</head>
<body>
<main>
  <h1 class="sr">Lo-fi cassette deck</h1>
  <div id="fit">
    <div class="stage" id="stage">
      <div class="floor" aria-hidden="true"></div>
      <div id="rack" role="group" aria-label="Cassettes"></div>

      <div class="side" aria-hidden="false">
        <div class="slot" aria-hidden="true"></div>
        <div class="tabwell">
          <button class="tab" id="kEject" type="button" aria-label="Eject"></button>
          <button class="tab" id="kPlay" type="button" aria-label="Play" aria-pressed="false"></button>
          <button class="tab" id="kStop" type="button" aria-label="Stop"></button>
        </div>
      </div>
      <div class="body" id="deck">
        <div class="feet" aria-hidden="true"><i></i><i></i></div>
        <div class="plate" aria-hidden="true"></div>

        <div class="lcd" role="img" aria-label="Display"><canvas id="disp" width="880" height="240"></canvas></div>
        <p class="sr" id="now" aria-live="polite"></p>

        <div class="knob-wrap" id="kw" style="--v:.6">
          <div class="bezel"></div><div class="ring"></div>
          <div class="knob" id="knob" role="slider" tabindex="0" aria-label="Volume" aria-valuemin="0" aria-valuemax="100" aria-valuenow="60"><div class="face"></div></div>
        </div>

        <button class="sbtn" id="loud" type="button" aria-pressed="false" aria-label="Loudness">
          <svg width="30" height="30" viewBox="0 0 30 30" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 5v20M15 5v20M22 5v20"/><rect x="5.5" y="16" width="5" height="3.2" rx="1" fill="#eae1d2"/><rect x="12.5" y="9" width="5" height="3.2" rx="1" fill="#eae1d2"/><rect x="19.5" y="14" width="5" height="3.2" rx="1" fill="#eae1d2"/></svg>
        </button>
        <button class="sbtn" id="nr" type="button" aria-pressed="false" aria-label="Noise reduction">
          <svg width="30" height="30" viewBox="0 0 30 30" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="10" cy="15" r="2" fill="currentColor"/><path d="M15 10.5a6.5 6.5 0 0 1 0 9M19 7.5a11 11 0 0 1 0 15"/></svg>
        </button>
        <div class="grille" aria-hidden="true"></div>
        <div class="led" id="led" aria-hidden="true"></div>
        <div class="port" aria-hidden="true"></div>

        <div class="win" aria-hidden="true">
          <svg class="mech" width="420" height="216" viewBox="0 0 420 216">
            <g fill="#5d544a" stroke="#2a221c" stroke-width="1"><circle cx="125" cy="108" r="9"/><circle cx="295" cy="108" r="9"/></g>
            <g stroke="#8d8377" stroke-width="2" stroke-linecap="round"><path d="M125 101v-4M131 111.5l3.5 2M119 111.5l-3.5 2M295 101v-4M301 111.5l3.5 2M289 111.5l-3.5 2"/></g>
            <rect x="190" y="196" width="40" height="20" rx="3" fill="#8b857d" stroke="#3a332c"/><rect x="204" y="196" width="12" height="6" fill="#c9c4bb"/>
            <circle cx="148" cy="200" r="3.5" fill="#9a948b"/><circle cx="272" cy="200" r="3.5" fill="#9a948b"/>
          </svg>
          <div class="cas" id="cas"><canvas id="reels" width="800" height="392"></canvas><svg id="casFront" viewBox="0 0 400 196"></svg></div>
          <div class="smoke"></div>
          <div class="doorglass"></div>
          <i class="wscrew" style="left:10px;top:10px"></i><i class="wscrew" style="right:10px;top:10px"></i>
          <i class="wscrew" style="left:10px;bottom:10px"></i><i class="wscrew" style="right:10px;bottom:10px"></i>
        </div>

        <div class="transport" role="group" aria-label="Transport">
          <button class="tbtn" id="rew" type="button" aria-pressed="false" aria-label="Rewind">
            <svg width="26" height="20" viewBox="0 0 30 24" fill="currentColor"><path d="M14 3v18L2 12zM28 3v18L16 12z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg></button>
          <button class="tbtn" id="stop" type="button" aria-label="Stop">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="3" width="18" height="18" rx="3"/></svg></button>
          <button class="tbtn" id="play" type="button" aria-label="Play" aria-pressed="false">
            <svg width="20" height="22" viewBox="0 0 24 26" fill="currentColor"><path d="M4 3v20l17-10z" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/></svg></button>
          <button class="tbtn" id="pause" type="button" aria-label="Pause" aria-pressed="false">
            <svg width="18" height="20" viewBox="0 0 22 24" fill="currentColor"><rect x="2" y="3" width="6" height="18" rx="1.5"/><rect x="14" y="3" width="6" height="18" rx="1.5"/></svg></button>
          <button class="tbtn" id="ffw" type="button" aria-pressed="false" aria-label="Fast forward">
            <svg width="26" height="20" viewBox="0 0 30 24" fill="currentColor"><path d="M2 3v18l12-9zM16 3v18l12-9z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg></button>
        </div>

        <svg class="strap" width="64" height="330" viewBox="0 0 64 330" aria-hidden="true">
          <defs>
            <linearGradient id="lth" x1="34" x2="56" y1="0" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#b8743c"/><stop offset=".5" stop-color="#965629"/><stop offset="1" stop-color="#6c3c1b"/></linearGradient>
            <linearGradient id="brass" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#f0dcae"/><stop offset=".55" stop-color="#bf9452"/><stop offset="1" stop-color="#86622f"/></linearGradient>
          </defs>
          <rect x="14" y="12" width="12" height="34" rx="3" fill="#ddd2c0" stroke="rgba(110,86,56,.4)" stroke-width="1"/>
          <path d="M36 30C47 44 50 96 48 160S43 262 41 300" fill="none" stroke="#4e2b14" stroke-width="12" stroke-linecap="round"/>
          <path d="M36 30C47 44 50 96 48 160S43 262 41 300" fill="none" stroke="url(#lth)" stroke-width="10" stroke-linecap="round"/>
          <path d="M36 30C47 44 50 96 48 160S43 262 41 300" fill="none" stroke="rgba(40,18,6,.55)" stroke-width=".8"/>
          <path d="M33.5 32C44 46 46.5 96 44.5 160S39.6 262 37.6 298" fill="none" stroke="rgba(255,220,180,.32)" stroke-width="1.4" stroke-linecap="round"/>
          <rect x="40" y="70" width="17" height="16" rx="3" fill="#7a4420" stroke="#4e2b14" stroke-width="1" transform="rotate(4 48 78)"/>
          <rect x="22" y="20" width="18" height="18" rx="7" fill="none" stroke="url(#brass)" stroke-width="3.2"/>
        </svg>
      </div>
    </div>
  </div>
</main>

<script>
(() => {
  'use strict';
  const $ = (id) => document.getElementById(id);

  const TRACKS = [
    { title: 'High On Life',   artist: 'Martin Garrix ft. Bonn', dur: 192, bpm: 84, root: 57, scale: 'maj', seed: 11, prog: [[0, 'maj7'], [7, 'dom7'], [9, 'm7'], [5, 'maj7']],
      shell: '#d6c9b4', line: '#e0682e', art: ['#f9cf94', '#e98a4a', '#ffe0b0', '#6b4330', '#3d281d'] },
    { title: 'No Sleep',       artist: 'Martin Garrix ft. Bonn', dur: 236, bpm: 72, root: 52, scale: 'min', seed: 23, prog: [[0, 'm7'], [8, 'maj7'], [3, 'maj7'], [10, 'dom7']],

  function pack(cn, r) {
    const g = rc.createRadialGradient(cn.x, cn.y, 12, cn.x, cn.y, r);
    g.addColorStop(0, '#3a2819'); g.addColorStop(.8, '#5e412b'); g.addColorStop(1, '#74523a');
    rc.fillStyle = g; rc.beginPath(); rc.arc(cn.x, cn.y, r, 0, 7); rc.fill();
    rc.lineWidth = .6;
    for (let q = 16; q < r - 1; q += 2.6) { rc.strokeStyle = `rgba(255,225,190,${.025 + (q % 7) * .004})`; rc.beginPath(); rc.arc(cn.x, cn.y, q, 0, 7); rc.stroke(); }
    rc.fillStyle = 'rgba(255,230,200,.11)';
    for (const a of [-2.2, .94]) { rc.beginPath(); rc.moveTo(cn.x, cn.y); rc.arc(cn.x, cn.y, r, a - .28, a + .28); rc.closePath(); rc.fill(); }
    rc.strokeStyle = 'rgba(0,0,0,.55)'; rc.lineWidth = 1; rc.beginPath(); rc.arc(cn.x, cn.y, r, 0, 7); rc.stroke();
  }
  function hub(cn, ang) {
    rc.save(); rc.translate(cn.x, cn.y);
    const g = rc.createRadialGradient(-4, -5, 2, 0, 0, 15); g.addColorStop(0, '#fbf8f2'); g.addColorStop(1, '#cfc7b8');
    rc.fillStyle = g; rc.beginPath(); rc.arc(0, 0, 14, 0, 7); rc.fill();
    rc.strokeStyle = 'rgba(0,0,0,.3)'; rc.lineWidth = .8; rc.stroke();
    rc.rotate(ang);
    rc.fillStyle = '#1e1813'; rc.beginPath(); rc.arc(0, 0, 9.5, 0, 7); rc.fill();
    rc.fillStyle = '#ece6da';
    for (let i = 0; i < 6; i++) { rc.save(); rc.rotate(i * Math.PI / 3); rc.fillRect(-1.6, -9.8, 3.2, 3.6); rc.restore(); }
    rc.fillStyle = '#b5ad9f'; rc.fillRect(-3, 10.2, 6, 3.4);
    rc.fillStyle = '#5f564d'; rc.beginPath(); rc.arc(0, 0, 4.2, 0, 7); rc.fill();
    rc.strokeStyle = '#8d8377'; rc.lineWidth = 1;
    for (let i = 0; i < 3; i++) { rc.save(); rc.rotate(i * 2.094); rc.beginPath(); rc.moveTo(0, -1); rc.lineTo(0, -4.2); rc.stroke(); rc.restore(); }
    rc.restore();
  }
  function drawReels(dt) {
    const target = S.wind ? S.wind * 10 : S.playing ? 1 : 0;
    spd += (target - spd) * (1 - Math.exp(-dt * (S.wind ? 2.5 : 6)));
    if (S.deck < 0) return;
    const tr = TRACKS[S.deck];
    const p = clamp(S.t / tr.dur, 0, 1), span = R_MAX * R_MAX - R_MIN * R_MIN;
    const rR = Math.sqrt(R_MIN * R_MIN + p * span), rL = Math.sqrt(R_MAX * R_MAX - p * span);
    const cap = (w) => clamp(w, -20, 20);
    angL += cap(TAPE_V * spd / rL) * dt; angR += cap(TAPE_V * spd / rR) * dt;
    rc.clearRect(0, 0, 400, 196);
    rc.fillStyle = '#0f0b08'; rc.fillRect(0, 0, 400, 196);
    rc.fillStyle = '#8f8a82'; rc.fillRect(194, 174, 12, 2);
    rc.fillStyle = '#d9cdb6'; rc.fillRect(191, 176, 18, 5);
    const tl = tangent(HUB_L, rL, GUIDE_L, true), tg = tangent(HUB_R, rR, GUIDE_R, false);
    rc.strokeStyle = '#4a3424'; rc.lineWidth = 3.4;
    rc.beginPath(); rc.moveTo(tl.x, tl.y); rc.lineTo(GUIDE_L.x, GUIDE_L.y); rc.lineTo(GUIDE_R.x, GUIDE_R.y); rc.lineTo(tg.x, tg.y); rc.stroke();
    pack(HUB_L, rL); pack(HUB_R, rR);
    hub(HUB_L, angL); hub(HUB_R, angR);
  }

  /* ---------- Frame loop ---------- */
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(.1, (now - last) / 1000); last = now;
    const tr = seated();
    if (tr) {
      if (S.wind) {
        S.t += S.wind * dt * 14 * Math.min(1, Math.abs(spd) / 10 + .15);
        if (S.t <= 0) { S.t = 0; halt(); ui(); }
        else if (S.t >= tr.dur) { S.t = tr.dur; halt(); toast('End of tape'); ui(); }
      } else if (S.playing) {
        S.t = tr.rec ? tr.rec.currentTime : S.t + dt;
        if (S.t >= tr.dur) { S.t = tr.dur; halt(); S.paused = false; toast('End of tape'); ui(); }
      }
    }
    // Redraw only while something changes: playback, winding, a moving tape, a dissolve, a message, or a recent input
    const moving = tapes.some((t) => t.tw || t.sp || t.drag);
    const settling = Math.abs(spd) > .004 || hs.some((v) => v > .002) || casY !== 0;
    if (S.playing || S.wind || moving || settling || dT0 >= 0 || msg || dirty > 0) {
      stepMotion(now, dt); drawDisplay(dt); drawReels(dt);
      if (dirty > 0) dirty--;
    }
    requestAnimationFrame(frame);
  }

  for (const ev of ['pointerdown', 'keydown', 'wheel']) document.addEventListener(ev, poke, true);
  window.addEventListener('pagehide', () => { if (S.playing) pause(); });
  // First tape starts seated in the deck
  const t0 = tapes[0]; t0.role = 'deck'; t0.x = DECK_X; t0.y = DECK_Y; t0.r = 0; render(t0);
  el.front.innerHTML = casSVG(TRACKS[0], false);
  for (const { t, to } of pileHomes()) { Object.assign(t, to); render(t); }
  ui(); setVol(S.vol);
  requestAnimationFrame(frame);
  window.__deck = { S, TRACKS, tapes };
})();
</script>
